server {
    listen 80;
    listen [::]:80;
    server_name easvue.624work.club;

    root /www/wwwroot/easvue.624work.club/current/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/easvue.624work.club/shared/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        alias /www/wwwroot/easvue.624work.club/shared/uploads/;
        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/easvue.624work.club.log;
    error_log /www/wwwlogs/easvue.624work.club.error.log;
}
