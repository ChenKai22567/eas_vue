server {
    listen 80;
    listen [::]:80;
    server_name easvue.624work.club;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/easvue.624work.club/shared/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name easvue.624work.club;

    root /www/wwwroot/easvue.624work.club/current/dist;
    index index.html;

    # 宝塔 ACME 续签任务直接更新此目录。
    ssl_certificate /www/server/panel/vhost/letsencrypt/easvue.624work.club/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/easvue.624work.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        alias /www/wwwroot/easvue.624work.club/shared/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/easvue.624work.club.log;
    error_log /www/wwwlogs/easvue.624work.club.error.log;
}
